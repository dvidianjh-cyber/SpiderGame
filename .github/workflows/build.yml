name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test game rules and build the APK
        run: ./gradlew --no-daemon :game:test :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SpiderCards-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpiderCards-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish a release for the phone to download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpiderCards 1.0.${{ github.run_number }}
          body: Download the APK below on your phone and open it to install or update.
          files: out/*.apk
          make_latest: true
